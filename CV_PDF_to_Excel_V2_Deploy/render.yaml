services:
  - type: web
    name: annexure-convertor
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: FRONTEND_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
